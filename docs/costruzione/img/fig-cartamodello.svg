<rect width="860" height="900" fill="#ffffff"/>
<text x="24" y="30" font-size="17" text-anchor="start" font-weight="600" fill="#1d2433">Cartamodello: due quadrati ruotati di 45°</text><text x="24" y="50" font-size="12.5" text-anchor="start" font-weight="400" fill="#5b6474">Misure della linea di cucitura per una dapo da 67 cm; il taglio è 1 cm più fuori</text><circle cx="400" cy="430" r="351.75" fill="none" stroke="#9aa3b2" stroke-width="1" stroke-dasharray="3 5"/><path d="M751.75,430 L400,78.25 L48.25,430 L400,781.75 Z" stroke="#9aa3b2" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><path d="M648.72,181.28 L151.28,181.28 L151.28,678.72 L648.72,678.72 Z" stroke="#9aa3b2" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><path d="M766.6,430 L659.22,322.63 L659.22,170.78 L507.37,170.78 L400,63.4 L292.63,170.78 L140.78,170.78 L140.78,322.63 L33.4,430 L140.78,537.37 L140.78,689.22 L292.63,689.22 L400,796.6 L507.37,689.22 L659.22,689.22 L659.22,537.37 Z" stroke="#1d2433" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M751.75,430 L648.72,326.97 L648.72,181.28 L503.03,181.28 L400,78.25 L296.97,181.28 L151.28,181.28 L151.28,326.97 L48.25,430 L151.28,533.03 L151.28,678.72 L296.97,678.72 L400,781.75 L503.03,678.72 L648.72,678.72 L648.72,533.03 Z" stroke="#6d48c9" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="751.75" cy="430" r="4" fill="#6d48c9"/><circle cx="648.72" cy="181.28" r="4" fill="#6d48c9"/><circle cx="400" cy="78.25" r="4" fill="#6d48c9"/><circle cx="151.28" cy="181.28" r="4" fill="#6d48c9"/><circle cx="48.25" cy="430" r="4" fill="#6d48c9"/><circle cx="151.28" cy="678.72" r="4" fill="#6d48c9"/><circle cx="400" cy="781.75" r="4" fill="#6d48c9"/><circle cx="648.72" cy="678.72" r="4" fill="#6d48c9"/><line x1="390" y1="430" x2="410" y2="430" stroke="#1d2433" stroke-width="1.4" stroke-linecap="round"/><line x1="400" y1="420" x2="400" y2="440" stroke="#1d2433" stroke-width="1.4" stroke-linecap="round"/><text x="408" y="452" font-size="11" text-anchor="start" font-weight="400" fill="#5b6474">centro</text><line x1="737.33" y1="415.58" x2="663.15" y2="341.4" stroke="#fff" stroke-width="6" stroke-linecap="round"/><line x1="737.33" y1="415.58" x2="663.15" y2="341.4" stroke="#e07b00" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="730.33" y1="408.58" x2="744.33" y2="422.58" stroke="#e07b00" stroke-width="2" stroke-linecap="round"/><line x1="656.15" y1="334.4" x2="670.15" y2="348.4" stroke="#e07b00" stroke-width="2" stroke-linecap="round"/><text x="690" y="200" font-size="12" text-anchor="start" font-weight="600" fill="#e07b00">apertura per rivoltare</text><text x="690" y="215" font-size="11" text-anchor="start" font-weight="400" fill="#e07b00">(non cucire qui: ~10 cm)</text><line x1="720" y1="222" x2="708.24" y2="372.49" stroke="#e07b00" stroke-width="1" stroke-linecap="round" marker-end="url(#arrM)"/><line x1="48.25" y1="815.75" x2="751.75" y2="815.75" stroke="#5b6474" stroke-width="1" stroke-linecap="round" marker-end="url(#arrM)" marker-start="url(#arrM)"/><line x1="48.25" y1="438" x2="48.25" y2="821.75" stroke="#9aa3b2" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="751.75" y1="438" x2="751.75" y2="821.75" stroke="#9aa3b2" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3 3"/><text x="400" y="835.75" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1d2433">da punta a punta 67 cm (raggio delle punte 33,5 cm)</text><line x1="151.28" y1="155.28" x2="648.72" y2="155.28" stroke="#5b6474" stroke-width="1" stroke-linecap="round" marker-end="url(#arrM)" marker-start="url(#arrM)"/><text x="157.28" y="149.28" font-size="12" text-anchor="start" font-weight="400" fill="#5b6474">lato del quadrato 47,4 cm</text><line x1="400" y1="430" x2="503.03" y2="181.28" stroke="#2e9d57" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrG)"/><text x="448.66" y="293.2" font-size="12" text-anchor="end" font-weight="400" fill="#2e9d57">valle r = 25,6 cm</text><text x="139.28" y="623.88" font-size="12" text-anchor="end" font-weight="400" fill="#6d48c9">lato 13,9 cm</text><text x="24" y="852" font-size="12" text-anchor="start" font-weight="400" fill="#5b6474">Area finita 0,263 m² · perimetro 2,22 m · ogni strato si taglia da un quadrato di 70×70 cm</text><line x1="24" y1="878" x2="64" y2="878" stroke="#6d48c9" stroke-width="2.6" stroke-linecap="round"/><text x="70" y="882" font-size="12" text-anchor="start" font-weight="400" fill="#1d2433">linea di cucitura</text><line x1="220" y1="878" x2="260" y2="878" stroke="#1d2433" stroke-width="1.6" stroke-linecap="round"/><text x="266" y="882" font-size="12" text-anchor="start" font-weight="400" fill="#1d2433">linea di taglio (+1 cm)</text><line x1="450" y1="878" x2="490" y2="878" stroke="#9aa3b2" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="8 6"/><text x="496" y="882" font-size="12" text-anchor="start" font-weight="400" fill="#1d2433">costruzione: i due quadrati</text>
</svg>
