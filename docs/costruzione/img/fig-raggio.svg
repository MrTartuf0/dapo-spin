ct x="468.8" y="178" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="499.2" y="137" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="499.2" y="178" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="529.6" y="137" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="529.6" y="178" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="560" y="137" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="560" y="178" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="590.4" y="137" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="590.4" y="178" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="620.8" y="137" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="620.8" y="178" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="651.2" y="137" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="651.2" y="178" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="681.6" y="137" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="681.6" y="178" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="712" y="137" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="712" y="178" width="12" height="7" rx="1.5" fill="#fff" stroke="#1d2433" stroke-width="1"/><text x="490" y="126" font-size="12" text-anchor="middle" font-weight="400" fill="#1d2433">striscia faccia A: 16 LED verso l’alto, dati dal centro verso la punta →</text><text x="490" y="208" font-size="12" text-anchor="middle" font-weight="400" fill="#1d2433">← striscia faccia B: 16 LED verso il basso, dati dalla punta verso il centro</text><text x="490" y="226" font-size="11" text-anchor="middle" font-weight="400" fill="#5b6474">in mezzo: il biadesivo delle due strisce, schiena contro schiena</text><rect x="234" y="128" width="70" height="68" rx="6" fill="rgba(120,130,150,0.18)" stroke="#9aa3b2" stroke-width="1"/><rect x="676" y="128" width="70" height="68" rx="6" fill="rgba(120,130,150,0.18)" stroke="#9aa3b2" stroke-width="1"/><path d="M80,92 L160,92 L240,146" stroke="#d1453b" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="96" font-size="11" text-anchor="end" font-weight="400" fill="#d1453b">VLED</text><path d="M80,107 L160,107 L240,148.6" stroke="#c99700" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="111" font-size="11" text-anchor="end" font-weight="400" fill="#c99700">CLK in</text><path d="M80,122 L160,122 L240,151.2" stroke="#2e9d57" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="126" font-size="11" text-anchor="end" font-weight="400" fill="#2e9d57">DATI in</text><path d="M80,137 L160,137 L240,153.8" stroke="#222222" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="141" font-size="11" text-anchor="end" font-weight="400" fill="#222222">GND</text><path d="M80,196 L160,196 L240,170" stroke="#d1453b" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="200" font-size="11" text-anchor="end" font-weight="400" fill="#d1453b">VLED</text><path d="M80,211 L160,211 L240,172.6" stroke="#c99700" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/><text x="76" y="215" font-size="11" text-anchor="end" font-weight="400" fill="#c99700">CLK out</text><path d="M80,226 L160,226 L240,175.2" stroke="#2e9d57" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/><text x="76" y="230" font-size="11" text-anchor="end" font-weight="400" fill="#2e9d57">DATI out</text><path d="M80,241 L160,241 L240,177.8" stroke="#222222" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="245" font-size="11" text-anchor="end" font-weight="400" fill="#222222">GND</text><text x="110" y="78" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1d2433">ingresso faccia A</text><text x="110" y="266" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1d2433">uscita faccia B</text><text x="110" y="281" font-size="11" text-anchor="middle" font-weight="400" fill="#5b6474">→ raggio successivo</text><ellipse cx="270" cy="149" rx="16" ry="7" fill="rgba(120,180,255,0.35)" stroke="#2f6fd6" stroke-width="1"/><ellipse cx="270" cy="175" rx="16" ry="7" fill="rgba(120,180,255,0.35)" stroke="#2f6fd6" stroke-width="1"/><text x="270" y="116" font-size="10.5" text-anchor="middle" font-weight="400" fill="#2f6fd6">colla flessibile</text><path d="M740,146 C764,140 764,182 740,174" stroke="#d1453b" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M740,148 C774,137 774,185 740,172" stroke="#c99700" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M740,150 C784,134 784,188 740,170" stroke="#2e9d57" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M740,152 C794,131 794,191 740,168" stroke="#222222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="804" y="136" font-size="11.5" text-anchor="start" font-weight="600" fill="#1d2433">giro in punta</text><text x="804" y="151" font-size="11" text-anchor="start" font-weight="400" fill="#5b6474">uscita A → ingresso B</text><text x="804" y="165" font-size="11" text-anchor="start" font-weight="400" fill="#5b6474">4 fili 30 AWG, ~15 mm</text><text x="804" y="179" font-size="11" text-anchor="start" font-weight="400" fill="#5b6474">VLED, CLK, DATI, GND</text><text x="244" y="248" font-size="10.5" text-anchor="start" font-weight="400" fill="#5b6474">termorestringente trasparente sulle due estremità</text><line x1="240" y1="300" x2="740" y2="300" stroke="#5b6474" stroke-width="1" stroke-linecap="round" marker-end="url(#arrM)" marker-start="url(#arrM)"/><text x="490" y="318" font-size="12" text-anchor="middle" font-weight="400" fill="#1d2433">16 LED × 16,7 mm = 26,7 cm per faccia (striscia da r ≈ 4,8 a 31,4 cm)</text><line x1="945" y1="70" x2="945" y2="280" stroke="#6d48c9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/><text x="938" y="74" font-size="11" text-anchor="end" font-weight="400" fill="#6d48c9">cucitura del bordo</text><text x="938" y="88" font-size="11" text-anchor="end" font-weight="400" fill="#6d48c9">(r = 33,5 cm)</text><line x1="748" y1="280" x2="943" y2="280" stroke="#6d48c9" stroke-width="1" stroke-linecap="round" marker-end="url(#arrM)" marker-start="url(#arrM)"/><text x="842.5" y="272" font-size="11" text-anchor="middle" font-weight="400" fill="#6d48c9">≈ 2 cm liberi</text><text x="24" y="354" font-size="14" text-anchor="start" font-weight="600" fill="#1d2433">Piazzole al lato centro (vista dall’alto, ingrandite)</text><rect x="140" y="368" width="230" height="104" rx="4" fill="#2b2f38" stroke="#2b2f38" stroke-width="1.4"/><text x="255" y="492" font-size="12" text-anchor="middle" font-weight="600" fill="#1d2433">faccia A: ingresso (5V, CI, DI, GND)</text><rect x="290" y="380" width="62" height="16" rx="2" fill="#d9b25c" stroke="#a9852f" stroke-width="1"/><text x="321" y="392" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1d2433">5V</text><line x1="30" y1="388" x2="308" y2="388" stroke="#d1453b" stroke-width="3" stroke-linecap="round"/><rect x="290" y="403" width="62" height="16" rx="2" fill="#d9b25c" stroke="#a9852f" stroke-width="1"/><text x="321" y="415" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1d2433">CI</text><line x1="30" y1="411" x2="308" y2="411" stroke="#c99700" stroke-width="3" stroke-linecap="round"/><rect x="290" y="426" width="62" height="16" rx="2" fill="#d9b25c" stroke="#a9852f" stroke-width="1"/><text x="321" y="438" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1d2433">DI</text><line x1="30" y1="434" x2="308" y2="434" stroke="#2e9d57" stroke-width="3" stroke-linecap="round"/><rect x="290" y="449" width="62" height="16" rx="2" fill="#d9b25c" stroke="#a9852f" stroke-width="1"/><text x="321" y="461" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1d2433">GND</text><line x1="30" y1="457" x2="308" y2="457" stroke="#222222" stroke-width="3" stroke-linecap="round"/><rect x="160" y="404" width="30" height="30" rx="2" fill="#fff" stroke="#1d2433" stroke-width="1"/><text x="175" y="450" font-size="10" text-anchor="middle" font-weight="400" fill="#cfd3dc">LED 2020</text><rect x="700" y="368" width="230" height="104" rx="4" fill="#2b2f38" stroke="#2b2f38" stroke-width="1.4"/><text x="815" y="492" font-size="12" text-anchor="middle" font-weight="600" fill="#1d2433">faccia B: uscita (5V, CO, DO, GND)</text><rect x="850" y="380" width="62" height="16" rx="2" fill="#d9b25c" stroke="#a9852f" stroke-width="1"/><text x="881" y="392" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1d2433">5V</text><line x1="590" y1="388" x2="868" y2="388" stroke="#d1453b" stroke-width="3" stroke-linecap="round"/><rect x="850" y="403" width="62" height="16" rx="2" fill="#d9b25c" stroke="#a9852f" stroke-width="1"/><text x="881" y="415" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1d2433">CO</text><line x1="590" y1="411" x2="868" y2="411" stroke="#c99700" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><rect x="850" y="426" width="62" height="16" rx="2" fill="#d9b25c" stroke="#a9852f" stroke-width="1"/><text x="881" y="438" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1d2433">DO</text><line x1="590" y1="434" x2="868" y2="434" stroke="#2e9d57" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/><rect x="850" y="449" width="62" height="16" rx="2" fill="#d9b25c" stroke="#a9852f" stroke-width="1"/><text x="881" y="461" font-size="10.5" text-anchor="middle" font-weight="600" fill="#1d2433">GND</text><line x1="590" y1="457" x2="868" y2="457" stroke="#222222" stroke-width="3" stroke-linecap="round"/><rect x="720" y="404" width="30" height="30" rx="2" fill="#fff" stroke="#1d2433" stroke-width="1"/><text x="735" y="450" font-size="10" text-anchor="middle" font-weight="400" fill="#cfd3dc">LED 2020</text><text x="485" y="402" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">L’ordine delle piazzole cambia</text><text x="485" y="418" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">da un produttore all’altro:</text><text x="485" y="434" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">leggi sempre le scritte</text><text x="485" y="450" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">stampate sulla striscia.</text>
