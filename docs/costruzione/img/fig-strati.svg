<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="'Fira Sans', 'DejaVu Sans', Arial, sans-serif">
<title>Sezione degli strati</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1453b"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d57"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker>
</defs>
<rect width="1000" height="490" fill="#ffffff"/>
<text x="24" y="30" font-size="17" text-anchor="start" font-weight="600" fill="#1d2433">Sezione della dapo LED (esplosa, spessori esagerati)</text><text x="40" y="62" font-size="11.5" text-anchor="start" font-weight="400" fill="#e07b00">← centro (dito)</text><text x="800" y="62" font-size="11.5" text-anchor="end" font-weight="400" fill="#5b6474">bordo →</text><rect x="40" y="80" width="760" height="14" rx="3" fill="#efe9fb" stroke="#9aa3b2" stroke-width="1"/><text x="812" y="89" font-size="12" text-anchor="start" font-weight="600" fill="#1d2433">Faccia A</text><text x="812" y="103" font-size="10.5" text-anchor="start" font-weight="400" fill="#5b6474">lycra chiara 180–220 g/m²</text><rect x="40" y="112" width="720" height="22" rx="3" fill="#f7f7f7" stroke="#9aa3b2" stroke-width="1"/><text x="812" y="125" font-size="12" text-anchor="start" font-weight="600" fill="#1d2433">Diffusore</text><text x="812" y="139" font-size="10.5" text-anchor="start" font-weight="400" fill="#5b6474">ovatta 2–3 mm o rete 3D</text><rect x="40" y="152" width="760" height="10" rx="3" fill="#e6f4ec" stroke="#9aa3b2" stroke-width="1"/><text x="812" y="159" font-size="12" text-anchor="start" font-weight="600" fill="#1d2433">Anima</text><text x="812" y="173" font-size="10.5" text-anchor="start" font-weight="400" fill="#5b6474">power mesh bianca</text><path d="M234,158 Q260,128 286,158" stroke="#6d48c9" stroke-width="2" fill="rgba(109,72,201,0.08)" stroke-linejoin="round" stroke-linecap="round"/><path d="M234,158 Q260,188 286,158" stroke="#6d48c9" stroke-width="2" fill="rgba(109,72,201,0.08)" stroke-linejoin="round" stroke-linecap="round"/><rect x="247" y="151" width="26" height="12" rx="2" fill="#2b2f38" stroke="none" stroke-width="1.4"/><rect x="255" y="145" width="10" height="5" rx="1" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="255" y="164" width="10" height="5" rx="1" fill="#fff" stroke="#1d2433" stroke-width="1"/><path d="M257,143 L246,120 M263,143 L274,120" stroke="#c99700" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M257,171 L246,196 M263,171 L274,196" stroke="#c99700" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M494,158 Q520,128 546,158" stroke="#6d48c9" stroke-width="2" fill="rgba(109,72,201,0.08)" stroke-linejoin="round" stroke-linecap="round"/><path d="M494,158 Q520,188 546,158" stroke="#6d48c9" stroke-width="2" fill="rgba(109,72,201,0.08)" stroke-linejoin="round" stroke-linecap="round"/><rect x="507" y="151" width="26" height="12" rx="2" fill="#2b2f38" stroke="none" stroke-width="1.4"/><rect x="515" y="145" width="10" height="5" rx="1" fill="#fff" stroke="#1d2433" stroke-width="1"/><rect x="515" y="164" width="10" height="5" rx="1" fill="#fff" stroke="#1d2433" stroke-width="1"/><path d="M517,143 L506,120 M523,143 L534,120" stroke="#c99700" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/><path d="M517,171 L506,196 M523,171 L534,196" stroke="#c99700" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/><text x="400" y="212" font-size="11.5" text-anchor="middle" font-weight="400" fill="#6d48c9">canale = nastro cucito sull’anima con due cuciture a 8–9 mm; dentro scorre il raggio a doppia faccia</text><rect x="40" y="228" width="720" height="22" rx="3" fill="#f7f7f7" stroke="#9aa3b2" stroke-width="1"/><text x="812" y="241" font-size="12" text-anchor="start" font-weight="600" fill="#1d2433">Diffusore</text><text x="812" y="255" font-size="10.5" text-anchor="start" font-weight="400" fill="#5b6474">come sopra</text><rect x="270" y="268" width="530" height="14" rx="3" fill="#efe9fb" stroke="#9aa3b2" stroke-width="1"/><text x="812" y="278" font-size="12" text-anchor="start" font-weight="600" fill="#1d2433">Faccia B</text><text x="812" y="292" font-size="10.5" text-anchor="start" font-weight="400" fill="#5b6474">lycra, con apertura</text><text x="812" y="306" font-size="10.5" text-anchor="start" font-weight="400" fill="#5b6474">centrale</text><rect x="40" y="290" width="270" height="14" rx="3" fill="#e3dcf6" stroke="#6d48c9" stroke-width="1.2"/><text x="44" y="324" font-size="11.5" text-anchor="start" font-weight="400" fill="#6d48c9">coperchio centrale (doppio strato) sovrapposto 2 cm, chiuso da bottoni a pressione</text><circle cx="288" cy="283" r="5" fill="#fff" stroke="#6d48c9" stroke-width="1.6"/><rect x="110" y="254" width="110" height="12" rx="2" fill="#dfe9fb" stroke="#1d2433" stroke-width="1"/><text x="165" y="246" font-size="10.5" text-anchor="middle" font-weight="400" fill="#5b6474">batteria nella sua tasca</text><line x1="792" y1="72" x2="792" y2="312" stroke="#6d48c9" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="786" y="345" font-size="11.5" text-anchor="end" font-weight="400" fill="#6d48c9">cucitura del bordo: prende facce + anima</text><text x="786" y="360" font-size="11.5" text-anchor="end" font-weight="400" fill="#5b6474">i diffusori si fermano 1,5 cm prima (meno spessore)</text><text x="40" y="400" font-size="12" text-anchor="start" font-weight="400" fill="#1d2433">• Il raggio è fissato solo dal lato del centro: in punta resta ~0,8 cm di gioco nel canale, così la lycra può allungarsi.</text><text x="40" y="422" font-size="12" text-anchor="start" font-weight="400" fill="#1d2433">• Nessuna cucitura attraversa un canale: le impunture di trapunta (facoltative) stanno solo nelle valli.</text><text x="40" y="444" font-size="12" text-anchor="start" font-weight="400" fill="#1d2433">• Più distanza LED–tessuto = luce più morbida ma pixel POV meno nitidi: la scelta si fa con i campioni (vedi prove).</text>
</svg>
