<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="'Fira Sans', 'DejaVu Sans', Arial, sans-serif">
<title>Passi di cucitura</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1453b"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d57"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker>
</defs>
<rect width="1000" height="700" fill="#ffffff"/>
<text x="24" y="30" font-size="17" text-anchor="start" font-weight="600" fill="#1d2433">Le quattro mosse della cucitura “a sacco”</text><rect x="20" y="50" width="470" height="300" rx="10" fill="#fbfbfd" stroke="#e7eaf0" stroke-width="1.4"/><circle cx="46" cy="76" r="14" fill="#6d48c9" stroke="none" stroke-width="1.4"/><text x="46" y="81" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">1</text><text x="68" y="81" font-size="14.5" text-anchor="start" font-weight="600" fill="#1d2433">Dritto contro dritto, mollette, segna l’apertura</text><path d="M352.2,204 L320.8,172.6 L320.8,128.2 L276.4,128.2 L245,96.8 L213.6,128.2 L169.2,128.2 L169.2,172.6 L137.8,204 L169.2,235.4 L169.2,279.8 L213.6,279.8 L245,311.2 L276.4,279.8 L320.8,279.8 L320.8,235.4 Z" stroke="#6d48c9" stroke-width="2" fill="#efe9fb" stroke-linejoin="round" stroke-linecap="round"/><rect x="348.2" y="197" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(0 352.2 204)"/><rect x="316.8" y="165.6" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-22.5 320.8 172.6)"/><rect x="316.8" y="121.2" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-45 320.8 128.2)"/><rect x="272.4" y="121.2" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-67.5 276.4 128.2)"/><rect x="241" y="89.8" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-90 245 96.8)"/><rect x="209.6" y="121.2" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-112.5 213.6 128.2)"/><rect x="165.2" y="121.2" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-135 169.2 128.2)"/><rect x="165.2" y="165.6" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-157.5 169.2 172.6)"/><rect x="133.8" y="197" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-180 137.8 204)"/><rect x="165.2" y="228.4" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-202.5 169.2 235.4)"/><rect x="165.2" y="272.8" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-225 169.2 279.8)"/><rect x="209.6" y="272.8" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-247.5 213.6 279.8)"/><rect x="241" y="304.2" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-270 245 311.2)"/><rect x="272.4" y="272.8" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-292.5 276.4 279.8)"/><rect x="316.8" y="272.8" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-315 320.8 279.8)"/><rect x="316.8" y="228.4" width="8" height="14" rx="2" fill="#e07b00" stroke="none" stroke-width="1.4" transform="rotate(-337.5 320.8 235.4)"/><line x1="337.92" y1="193.72" x2="353.92" y2="201.72" stroke="#d1453b" stroke-width="3" stroke-linecap="round"/><line x1="319.08" y1="174.88" x2="335.08" y2="182.88" stroke="#d1453b" stroke-width="3" stroke-linecap="round"/><text x="380" y="120" font-size="11.5" text-anchor="start" font-weight="400" fill="#d1453b">segni rossi =</text><text x="380" y="134" font-size="11.5" text-anchor="start" font-weight="400" fill="#d1453b">inizio e fine</text><text x="380" y="148" font-size="11.5" text-anchor="start" font-weight="400" fill="#d1453b">dell’apertura</text><text x="40" y="336" font-size="11.5" text-anchor="start" font-weight="400" fill="#5b6474">Una molletta su ogni punta e ogni valle, poi una o due per lato.</text><rect x="510" y="50" width="470" height="300" rx="10" fill="#fbfbfd" stroke="#e7eaf0" stroke-width="1.4"/><circle cx="536" cy="76" r="14" fill="#6d48c9" stroke="none" stroke-width="1.4"/><text x="536" y="81" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">2</text><text x="558" y="81" font-size="14.5" text-anchor="start" font-weight="600" fill="#1d2433">Cuci a 1 cm dal bordo, gira sugli angoli</text><path d="M560,300 L710,150 L860,300" stroke="#1d2433" stroke-width="1.4" fill="#efe9fb" stroke-linejoin="round" stroke-linecap="round"/><path d="M590,300 L710,180 L830,300" stroke="#6d48c9" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="710" cy="180" r="5" fill="#d1453b"/><text x="742" y="170" font-size="11.5" text-anchor="start" font-weight="400" fill="#d1453b">ago giù → alza il piedino</text><text x="742" y="184" font-size="11.5" text-anchor="start" font-weight="400" fill="#d1453b">→ ruota la stoffa → riabbassa</text><text x="580" y="325" font-size="11.5" text-anchor="start" font-weight="400" fill="#5b6474">Punta: ruota di 90°. Valle: ruota di 45° nell’altro verso.</text><text x="580" y="342" font-size="11.5" text-anchor="start" font-weight="400" fill="#5b6474">Punto zigzag stretto (largh. 0,8–1 mm, lungh. 2,5).</text><rect x="20" y="370" width="470" height="300" rx="10" fill="#fbfbfd" stroke="#e7eaf0" stroke-width="1.4"/><circle cx="46" cy="396" r="14" fill="#6d48c9" stroke="none" stroke-width="1.4"/><text x="46" y="401" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">3</text><text x="68" y="401" font-size="14.5" text-anchor="start" font-weight="600" fill="#1d2433">Taglia le punte, incidi le valli</text><path d="M60,620 L180,460 L300,620" stroke="#1d2433" stroke-width="1.4" fill="#efe9fb" stroke-linejoin="round" stroke-linecap="round"/><path d="M86,620 L180,492 L274,620" stroke="#6d48c9" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M155,494 L205,494" stroke="#d1453b" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="215" y="490" font-size="11.5" text-anchor="start" font-weight="400" fill="#d1453b">taglia via la punta</text><text x="215" y="504" font-size="11.5" text-anchor="start" font-weight="400" fill="#d1453b">a 2–3 mm dalla cucitura</text><path d="M320,450 L380,540 L460,490" stroke="#1d2433" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M314,480 L378,572 L460,522" stroke="#6d48c9" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="380" y1="540" x2="379" y2="566" stroke="#d1453b" stroke-width="2.6" stroke-linecap="round"/><text x="310" y="610" font-size="11.5" text-anchor="start" font-weight="400" fill="#d1453b">incidi fino a 2 mm</text><text x="310" y="624" font-size="11.5" text-anchor="start" font-weight="400" fill="#d1453b">dalla cucitura, non oltre</text><rect x="510" y="370" width="470" height="300" rx="10" fill="#fbfbfd" stroke="#e7eaf0" stroke-width="1.4"/><circle cx="536" cy="396" r="14" fill="#6d48c9" stroke="none" stroke-width="1.4"/><text x="536" y="401" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">4</text><text x="558" y="401" font-size="14.5" text-anchor="start" font-weight="600" fill="#1d2433">Rivolta, spingi le punte, impuntura il bordo</text><path d="M845.5,522 L816.06,492.56 L816.06,450.94 L774.44,450.94 L745,421.5 L715.56,450.94 L673.94,450.94 L673.94,492.56 L644.5,522 L673.94,551.44 L673.94,593.06 L715.56,593.06 L745,622.5 L774.44,593.06 L816.06,593.06 L816.06,551.44 Z" stroke="#1d2433" stroke-width="1.6" fill="#efe9fb" stroke-linejoin="round" stroke-linecap="round"/><path d="M843.59,522 L814.71,493.12 L814.71,452.29 L773.88,452.29 L745,423.41 L716.12,452.29 L675.29,452.29 L675.29,493.12 L646.41,522 L675.29,550.88 L675.29,591.71 L716.12,591.71 L745,620.59 L773.88,591.71 L814.71,591.71 L814.71,550.88 Z" stroke="#6d48c9" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/><text x="530" y="656" font-size="11.5" text-anchor="start" font-weight="400" fill="#5b6474">Impuntura a 4–5 mm dal bordo: chiude l’apertura e tiene piatto il bordo.</text>
</svg>
