<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="'Fira Sans', 'DejaVu Sans', Arial, sans-serif">
<title>Schema a blocchi</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2433"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1453b"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d57"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6474"/></marker>
</defs>
<rect width="1000" height="540" fill="#ffffff"/>
<text x="24" y="32" font-size="17" text-anchor="start" font-weight="600" fill="#1d2433">Schema a blocchi: chi alimenta chi, chi comanda chi</text><rect x="24" y="70" width="200" height="76" rx="6" fill="#dfe9fb" stroke="#1d2433" stroke-width="1.4"/><text x="124" y="98.88" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2433">Batteria A</text><text x="124" y="118.15" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">LiPo 1S 600 mAh</text><text x="124" y="132.53" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">con protezione (PCM)</text><rect x="24" y="180" width="200" height="76" rx="6" fill="#dfe9fb" stroke="#1d2433" stroke-width="1.4"/><text x="124" y="208.88" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2433">Batteria B</text><text x="124" y="228.15" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">uguale ad A, lato opposto</text><text x="124" y="242.53" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">collegata in parallelo</text><line x1="224" y1="108" x2="262" y2="108" stroke="#d1453b" stroke-width="3.5" stroke-linecap="round"/><line x1="224" y1="218" x2="262" y2="218" stroke="#d1453b" stroke-width="3.5" stroke-linecap="round"/><line x1="262" y1="108" x2="262" y2="218" stroke="#d1453b" stroke-width="3.5" stroke-linecap="round"/><line x1="262" y1="163" x2="290" y2="163" stroke="#d1453b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrR)"/><rect x="292" y="128" width="150" height="70" rx="6" fill="#fff" stroke="#1d2433" stroke-width="1.4"/><text x="367" y="153.88" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2433">F1</text><text x="367" y="173.15" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">fusibile ripristinabile</text><text x="367" y="187.53" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">PTC 1,5 A</text><line x1="442" y1="163" x2="488" y2="163" stroke="#d1453b" stroke-width="3.5" stroke-linecap="round"/><line x1="488" y1="50" x2="488" y2="400" stroke="#d1453b" stroke-width="4" stroke-linecap="round"/><text x="474" y="44" font-size="12.5" text-anchor="end" font-weight="600" fill="#d1453b">VBAT 3,0–4,2 V</text><rect x="560" y="30" width="230" height="70" rx="6" fill="#fff8e8" stroke="#1d2433" stroke-width="1.4"/><text x="675" y="55.88" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2433">Caricatore USB-C</text><text x="675" y="75.15" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">MCP73831, ~500 mA</text><text x="675" y="89.53" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">presa di ricarica dell’utente</text><line x1="560" y1="65" x2="492" y2="65" stroke="#d1453b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrR)"/><rect x="560" y="140" width="210" height="112" rx="6" fill="#e3f1e3" stroke="#1d2433" stroke-width="1.4"/><text x="665" y="179.69" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2433">XIAO nRF52840 Sense</text><text x="665" y="198.96" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">IMU · Bluetooth · firmware</text><text x="665" y="213.34" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">alimentata dai pad BAT+/BAT−</text><text x="665" y="227.71" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">VBAT dal partitore interno</text><line x1="492" y1="196" x2="556" y2="196" stroke="#d1453b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrR)"/><rect x="560" y="300" width="210" height="84" rx="6" fill="#fff" stroke="#1d2433" stroke-width="1.4"/><text x="665" y="332.88" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2433">Interruttore LED</text><text x="665" y="352.15" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">P-MOSFET AO3401A + BSS138</text><text x="665" y="366.52" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">accensione morbida, 0 µA da spento</text><line x1="492" y1="342" x2="556" y2="342" stroke="#d1453b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrR)"/><line x1="665" y1="252" x2="665" y2="296" stroke="#2f6fd6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrB)"/><text x="673" y="280" font-size="11.5" text-anchor="start" font-weight="400" fill="#2f6fd6">D1 = LED_EN</text><line x1="770" y1="342" x2="860" y2="342" stroke="#d1453b" stroke-width="3.5" stroke-linecap="round"/><text x="814" y="334" font-size="12.5" text-anchor="middle" font-weight="600" fill="#d1453b">VLED</text><line x1="860" y1="342" x2="860" y2="430" stroke="#d1453b" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrR)"/><rect x="830" y="150" width="140" height="108" rx="6" fill="#eef3ff" stroke="#1d2433" stroke-width="1.4"/><text x="900" y="187.69" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2433">2× SN74LV1T34</text><text x="900" y="206.96" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">traslatori</text><text x="900" y="221.34" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">alimentati da VLED</text><text x="900" y="235.71" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">3,3 V → VLED</text><line x1="860" y1="342" x2="900" y2="342" stroke="#d1453b" stroke-width="2.5" stroke-linecap="round"/><line x1="900" y1="342" x2="900" y2="262" stroke="#d1453b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrR)"/><line x1="770" y1="180" x2="826" y2="180" stroke="#2f6fd6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrB)"/><text x="798" y="172" font-size="10.5" text-anchor="middle" font-weight="400" fill="#2f6fd6">D8 SCK</text><line x1="770" y1="230" x2="826" y2="230" stroke="#2f6fd6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrB)"/><text x="798" y="222" font-size="10.5" text-anchor="middle" font-weight="400" fill="#2f6fd6">D10 MOSI</text><path d="M970,204 L984,204 L984,470 L966,470" stroke="#2e9d57" stroke-width="2.4" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrG)"/><text x="976" y="300" font-size="11.5" text-anchor="start" font-weight="400" fill="#2e9d57" transform="rotate(90 976 300)">CLK + DATI</text><rect x="690" y="432" width="276" height="82" rx="6" fill="#fdf0f6" stroke="#1d2433" stroke-width="1.4"/><text x="828" y="463.88" font-size="14" text-anchor="middle" font-weight="600" fill="#1d2433">Catena LED (256)</text><text x="828" y="483.15" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">8 raggi × 2 facce × 16 LED</text><text x="828" y="497.52" font-size="11.5" text-anchor="middle" font-weight="400" fill="#5b6474">una sola catena a zig-zag</text><line x1="30" y1="470" x2="70" y2="470" stroke="#d1453b" stroke-width="4" stroke-linecap="round"/><text x="78" y="474" font-size="12" text-anchor="start" font-weight="400" fill="#1d2433">potenza (VBAT, VLED)</text><line x1="30" y1="494" x2="70" y2="494" stroke="#2f6fd6" stroke-width="2" stroke-linecap="round"/><text x="78" y="498" font-size="12" text-anchor="start" font-weight="400" fill="#1d2433">segnali 3,3 V dalla XIAO</text><line x1="30" y1="518" x2="70" y2="518" stroke="#2e9d57" stroke-width="2.4" stroke-linecap="round"/><text x="78" y="522" font-size="12" text-anchor="start" font-weight="400" fill="#1d2433">segnali al livello dei LED</text><text x="300" y="474" font-size="12" text-anchor="start" font-weight="400" fill="#5b6474">Tutte le masse (GND) sono in comune e non sono disegnate.</text><text x="300" y="498" font-size="12" text-anchor="start" font-weight="400" fill="#5b6474">Le batterie vanno collegate fra loro solo se hanno la stessa tensione.</text>
</svg>
