name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Build simulatore (Nuxt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate

  firmware:
    name: Compila firmware (XIAO nRF52840 Sense)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Core Seeed mbed e librerie
        run: |
          # il core di Seeed lo chiama per creare il pacchetto da caricare, ma su Linux non lo installa
          pipx install adafruit-nrfutil
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:mbed
          arduino-cli lib install "Seeed Arduino LSM6DS3" ArduinoBLE
      - name: Compila
        run: arduino-cli compile --fqbn Seeeduino:mbed:xiaonRF52840Sense --warnings default firmware/DapoIMU

  firmware-sim:
    name: Test firmware simulato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compila ed esegui
        working-directory: tests/firmware-sim
        run: g++ -std=c++17 -O2 -Wall -Imock test_fusion.cpp -o test_fusion && ./test_fusion

  dapo-lab:
    name: Build Dapo Lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/dapo-lab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: dapo-lab.html è aggiornato?
        run: git diff --exit-code -- dapo-lab.html || (echo "::error::Ricostruisci con 'npm run build' e committa dapo-lab.html" && exit 1)
